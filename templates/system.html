<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고우니 AI 시스템 상태</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="system-page">
  <main class="system-shell">
    <header class="system-header">
      <div>
        <p class="system-eyebrow">SAHA-GU AI OPERATIONS</p>
        <h1>고우니 AI 시스템 상태</h1>
        <p>웹 상담, 로컬 LLM, 검색 인덱스와 데이터 Worker 상태를 한눈에 확인합니다.</p>
      </div>
      <a class="system-back" href="/">상담 화면으로</a>
    </header>

    <section class="system-grid" aria-live="polite">
      <article class="system-card"><span>웹 API</span><strong id="webState">확인 중</strong><small>FastAPI 상담 서버</small></article>
      <article class="system-card"><span>로컬 Ollama</span><strong id="ollamaState">확인 중</strong><small id="ollamaModel">-</small></article>
      <article class="system-card"><span>검색 인덱스</span><strong id="searchState">확인 중</strong><small id="vectorCount">-</small></article>
      <article class="system-card"><span>처리 작업 큐</span><strong id="queueState">확인 중</strong><small id="queueCount">-</small></article>
    </section>

    <section class="system-panel">
      <div><span>최근 증분 크롤링</span><strong id="crawlState">기록 없음</strong></div>
      <div><span>개인정보 정책</span><strong>대화 영구 저장 안 함</strong></div>
      <div><span>구성</span><strong>Web · Worker · Ollama · Supabase</strong></div>
    </section>
    <p id="statusMessage" class="system-message">상태 정보를 불러오는 중입니다.</p>
  </main>
  <script>
    const setState = (id, ready, okText = '정상', badText = '확인 필요') => {
      const el = document.getElementById(id);
      el.textContent = ready ? okText : badText;
      el.className = ready ? 'state-ok' : 'state-warn';
    };
    fetch('/api/system-status')
      .then(response => response.json())
      .then(data => {
        setState('webState', data.web.ready);
        setState('ollamaState', data.ollama.model_ready, '연결됨', '설치·모델 필요');
        document.getElementById('ollamaModel').textContent = data.ollama.model;
        setState('searchState', data.search.ready);
        document.getElementById('vectorCount').textContent = `${data.search.total_vectors || 0}개 벡터`;
        setState('queueState', data.queue.available, '사용 가능', 'SQL 적용 필요');
        document.getElementById('queueCount').textContent = data.queue.available
          ? `대기 ${data.queue.queued} · 실패 ${data.queue.failed}` : 'ingestion_jobs 미적용';
        const crawl = data.latest_crawl;
        document.getElementById('crawlState').textContent = crawl
          ? `${crawl.status} · 신규 ${crawl.new_count} · 수정 ${crawl.updated_count}` : '마이그레이션 적용 후 표시';
        document.getElementById('statusMessage').textContent = data.status === 'ok'
          ? '모든 핵심 구성요소가 준비됐습니다.' : '경고 항목을 확인해 주세요.';
      })
      .catch(() => {
        document.getElementById('statusMessage').textContent = '상태 정보를 불러오지 못했습니다.';
      });
  </script>
</body>
</html>
